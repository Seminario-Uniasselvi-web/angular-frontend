<div class="flex flex-wrap gap-3 justify-content-center">
  @for (vehicle of vehicles; track $index) {
    <p-card
    [header]="vehicle.marca"
    [subheader]="'R$ '+ vehicle.valor"
    [style]="{ 'max-width': '360px' }"
  >
    <ng-template pTemplate="header">
      <img
        class="h-14rem"
        alt="Card"
        [src]="vehicle.imagem"
      />
    </ng-template>
    <div class="flex justify-content-between">
      <p>KM: {{vehicle.km}}</p>
      <p>Placa: {{vehicle.placa}}</p>
    </div>
      <p>{{vehicle.descricao.substring(0, 150) + '...' }}</p>
    <ng-template pTemplate="footer">
      <div>
        <p-button label="Falar com vendedor" class="w-full" styleClass="w-full" />
      </div>
    </ng-template>
  </p-card>
  }
</div>
